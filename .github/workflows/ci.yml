name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      # Shell scripts are outside the TypeScript and ESLint graphs. Parse them
      # here so a release does not discover a syntax error after reaching Vercel.
      # Live smoke checks remain an explicit production operator step because
      # they need credentials and must never run from CI.
      - run: bash -n scripts/*.sh
      - run: npm run lint
      - run: npm test
      # Vercel builds the same application, so this keeps broken releases out
      # of the production deployment path.
      - run: npm run build
