name: cue

# Default json-file logging is uncapped — a chatty container will fill the disk
# given enough time. Every service inherits this 3x10MB ceiling.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Memory ceilings. Without them one runaway process is a host-wide OOM event and
# the kernel picks its victim by global oom_score — which can be Postgres, the
# one container here whose loss is unrecoverable. A cgroup limit turns "the box
# dies" into "the offending container dies". Totals: 2.4G of 3.8G, leaving ~1.4G
# for `next build` (which runs outside these cgroups) and the host itself.
services:
  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m # idles at ~44MB; the rest is TLS handshakes and log buffers
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Staging keeps the default. Production sets CUE_ROBOTS=all in .env.
      CUE_ROBOTS: "${CUE_ROBOTS:-noindex, nofollow}"
    # Caddy answers on its own admin API long before it can usefully proxy, but
    # without a healthcheck a wedged Caddy reports "running" and the watchdog
    # will never restart it — the one service whose failure takes the whole site
    # down. `depends_on` stays condition-less on purpose: lb_try_duration makes
    # Caddy hold requests until the app answers, so gating startup on app health
    # would only turn a brief 502 window into a fully dark site.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - app
    networks: [edge]

  app:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_URL: ${PUBLIC_URL}
    restart: unless-stopped
    # Runs at 56-65MB today. 768m is ~12x that: room for traffic, PDF work, and
    # a leak to be visible in the console before the cgroup kills it.
    mem_limit: 768m
    volumes:
      # Written by the host health watchdog (cue-health.timer). Provisioned
      # read-only for a future console panel — nothing in src/ reads it today.
      - /var/lib/cue:/var/lib/cue:ro
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cue:${POSTGRES_PASSWORD}@postgres:5432/cue
      REDIS_URL: redis://redis:6379
      DOCKER_API: http://dockerproxy:2375
      PUBLIC_URL: ${PUBLIC_URL}
      BETTER_AUTH_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      IP_SALT: ${IP_SALT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, internal]

  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    # 128MB shared_buffers + WAL buffers + per-connection work_mem, with room to
    # spare. There are no backups, so this container must never be the one that
    # dies: the negative oom_score_adj makes the kernel pick any other process
    # first if the host runs out of memory outside these cgroups (e.g. a build).
    mem_limit: 1g
    oom_score_adj: -500
    environment:
      POSTGRES_USER: cue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cue -d cue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No `ports:` on purpose. Postgres is reachable only from the internal
    # compose network; nothing binds it to a public interface.
    networks: [internal]

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    # Idles at ~2MB. maxmemory is deliberately not set: nothing writes to Redis
    # yet, and evicting queued jobs is worse than a visible restart.
    mem_limit: 256m
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  # Read-only, endpoint-filtered view of the Docker API. The app reads container
  # health through this instead of mounting docker.sock, which would hand an
  # internet-facing container root on the host.
  dockerproxy:
    logging: *logging
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    mem_limit: 64m # a HAProxy shim; idles at ~2MB
    environment:
      CONTAINERS: 1
      POST: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      INFO: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      NODES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: true
